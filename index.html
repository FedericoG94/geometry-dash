<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07142a"><link rel="manifest" href="manifest.webmanifest"><title>Geometry Dash Offline</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07142a;touch-action:none;user-select:none}body{position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#ui{position:fixed;inset:0;color:#fff;font-family:Arial,sans-serif;pointer-events:none}#hud{position:absolute;top:max(9px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(760px,88vw);text-align:center;text-shadow:0 2px 5px #000}#title{font-size:14px;font-weight:900;letter-spacing:2px}#bar{height:10px;margin-top:6px;border:1px solid #7180a2;background:#182844;border-radius:8px;overflow:hidden}#progress{height:100%;width:0;background:linear-gradient(90deg,#27e6ff,#b6ff48)}#percent{font-size:11px;margin-top:3px}#jump{position:absolute;right:18px;bottom:max(18px,env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;background:#23d8ff2f;border:2px solid #d8f8ff99;color:#fff;font-size:11px;font-weight:900;pointer-events:auto;display:none}@media(pointer:coarse){#jump{display:block}}#hint{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;color:#bfd0ef;white-space:nowrap}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#020714bd;pointer-events:auto}.hide{display:none!important}.panel{width:min(530px,90vw);padding:24px 18px;border-radius:20px;text-align:center;background:linear-gradient(#15264b,#0b142a);border:2px solid #35ddff;box-shadow:0 0 45px #28dcff30}h1{margin:0 0 8px;font-size:32px;letter-spacing:2px}p{color:#c0cce7;line-height:1.4}button{border:0;border-radius:12px;padding:13px 22px;margin:5px;font-size:16px;font-weight:900;background:#36dfff;color:#06111c;box-shadow:0 4px 0 #188ba7}.stats{margin:12px 0 6px}.stat{margin:0 12px}.big{font-size:23px;font-weight:900}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="hud"><div id="title">GEOMETRY DASH · OFFLINE</div><div id="bar"><div id="progress"></div></div><div id="percent">0%</div></div><button id="jump">SALTA</button><div id="hint">TOCCA QUALSIASI PUNTO PER SALTARE</div><section id="menu" class="overlay"><div class="panel"><h1>GEOMETRY DASH</h1><p>Il cubo corre automaticamente. Tocca per saltare.</p><div class="stats"><span class="stat">Best <span id="best" class="big">0%</span></span><span class="stat">Monete <span id="coins" class="big">0/3</span></span></div><button id="play">GIOCA</button></div></section><section id="dead" class="overlay hide"><div class="panel"><h1>CRASH!</h1><p id="deadText"></p><button id="retry">RIPROVA</button><button id="back">MENU</button></div></section><section id="win" class="overlay hide"><div class="panel"><h1>100% COMPLETATO!</h1><p>Livello terminato.</p><button id="again">RIGIOCA</button><button id="menu2">MENU</button></div></section></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let W,H,D=1,run=0,last=0,cam=0,buf=0,coy=0,speed=290,grav=1500,jump=-655;const S=500,E=17000,G=112,p={x:S,y:0,s:30,v:0,ground:1,r:0},sp=[],bl=[],pa=[],co=[];function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);if(!run)p.y=H-G-p.s}addEventListener('resize',rs);rs();function spike(a,n=1){for(let i=0;i<n;i++)sp.push({x:a+i*40,w:34,h:42})}function block(a,h){bl.push({x:a,w:50,h})}function pad(a){pa.push({x:a,w:54})}function coin(a,y){co.push({x:a,y,r:12,t:0})}spike(1150);spike(1480,2);block(1880,55);spike(2100);pad(2440);spike(2650,2);block(3100,70);spike(3340);spike(3600,2);pad(4010);spike(4230,3);block(4720,78);spike(4970);spike(5230,2);pad(5680);spike(5920,3);block(6430,68);spike(6690);pad(7110);spike(7340,2);block(7830,82);spike(8100);spike(8370,2);pad(8840);spike(9070,3);block(9610,78);spike(9880);pad(10310);spike(10550,2);block(11020,72);spike(11290,3);pad(11760);spike(11990,2);block(12450,84);spike(12730);pad(13120);spike(13370,3);block(13900,80);spike(14190);spike(14480,2);pad(14940);spike(15170,3);block(15700,75);spike(15980);spike(16240,2);spike(16600);coin(1760,120);coin(5570,135);coin(10210,125);let best=+localStorage.gd_best||0,saved=JSON.parse(localStorage.gd_coins||'[]');bestEl.textContent=best+'%';coins.textContent=saved.length+'/3';function hide(a){document.getElementById(a).classList.add('hide')}function show(a){document.getElementById(a).classList.remove('hide')}function gy(){return H-G}function start(){p.x=S;p.y=gy()-p.s;p.v=0;p.ground=1;p.r=0;cam=0;buf=0;coy=0;hide('menu');hide('dead');hide('win');run=1;last=performance.now();requestAnimationFrame(loop)}function inp(){if(run)buf=.13}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function hb(){return{x:p.x+5,y:p.y+5,w:p.s-10,h:p.s-10}}function die(){run=0;let q=Math.max(0,Math.min(100,Math.floor((p.x-S)/(E-S)*100)));best=Math.max(best,q);localStorage.gd_best=best;bestEl.textContent=best+'%';deadText.textContent='Progressi: '+q+'%';show('dead')}function upd(dt){buf=Math.max(0,buf-dt);coy=Math.max(0,coy-dt);if(buf>0&&(p.ground||coy>0)){p.v=jump;p.ground=0;buf=0;coy=0}let old=p.y+p.s;p.x+=speed*dt;p.v+=grav*dt;p.y+=p.v*dt;p.ground=0;if(p.y+p.s>=gy()){p.y=gy()-p.s;p.v=0;p.ground=1;coy=.1}for(const b of bl){let top=gy()-b.h,hor=p.x+p.s-5>b.x&&p.x+5<b.x+b.w;if(!hor)continue;if(p.v>=0&&old<=top+2&&p.y+p.s>=top){p.y=top-p.s;p.v=0;p.ground=1;coy=.1}else if(hit(hb(),{x:b.x,y:top,w:b.w,h:b.h})){die();return}}for(const s of sp)if(hit(hb(),{x:s.x+8,y:gy()-s.h+8,w:s.w-16,h:s.h-8})){die();return}for(const a of pa)if(p.v>=0&&hit(hb(),{x:a.x,y:gy()-13,w:a.w,h:14})){p.y=gy()-p.s-2;p.v=-725;p.ground=0}let cx=p.x+p.s/2,cy=p.y+p.s/2;co.forEach((q,i)=>{if(!q.t&&Math.abs(cx-q.x)<30&&Math.abs(cy-(gy()-q.y))<40){q.t=1;if(!saved.includes(i)){saved.push(i);localStorage.gd_coins=JSON.stringify(saved);coins.textContent=saved.length+'/3'}}});cam=Math.max(0,p.x-W*.27);let pct=Math.min(100,Math.floor((p.x-S)/(E-S)*100));progress.style.width=pct+'%';percent.textContent=pct+'%';if(p.x>=E){run=0;best=100;localStorage.gd_best=100;bestEl.textContent='100%';show('win')}}function draw(){let g=gy();let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#07152f');bg.addColorStop(1,'#102d50');x.fillStyle=bg;x.fillRect(0,0,W,H);x.strokeStyle='#36dfff18';for(let z=(-cam*.18)%70;z<W;z+=70){x.beginPath();x.moveTo(z,0);x.lineTo(z,H);x.stroke()}x.fillStyle='#07101e';x.fillRect(0,g,W,H-g);x.strokeStyle='#42e8ff';x.lineWidth=3;x.beginPath();x.moveTo(0,g);x.lineTo(W,g);x.stroke();for(const b of bl){let z=b.x-cam;if(z+b.w<0||z>W)continue;x.fillStyle='#101722';x.fillRect(z,g-b.h,b.w,b.h);x.strokeStyle='#fff';x.strokeRect(z,g-b.h,b.w,b.h)}for(const a of pa){let z=a.x-cam;if(z+a.w<0||z>W)continue;x.fillStyle='#ffe34d';x.fillRect(z,g-13,a.w,10)}for(const s of sp){let z=s.x-cam;if(z+s.w<0||z>W)continue;x.fillStyle='#0b1019';x.beginPath();x.moveTo(z,g);x.lineTo(z+s.w/2,g-s.h);x.lineTo(z+s.w,g);x.closePath();x.fill();x.strokeStyle='#fff';x.stroke()}for(const q of co){if(q.t)continue;let z=q.x-cam;x.fillStyle='#ffe34d';x.beginPath();x.arc(z,g-q.y,q.r,0,7);x.fill();x.strokeStyle='#fff';x.stroke()}let z=p.x-cam;x.save();x.translate(z+p.s/2,p.y+p.s/2);x.rotate(p.r);x.fillStyle='#45e8ff';x.fillRect(-p.s/2,-p.s/2,p.s,p.s);x.strokeStyle='#fff';x.strokeRect(-p.s/2,-p.s/2,p.s,p.s);x.restore()}function loop(t){if(!run)return;let dt=Math.min(.022,(t-last)/1000);last=t;upd(dt);if(!run)return;if(!p.ground)p.r+=.12;draw();requestAnimationFrame(loop)}jump.onpointerdown=e=>{e.preventDefault();e.stopPropagation();inp()};c.onpointerdown=e=>{e.preventDefault();inp()};addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();inp()}if(e.code==='KeyR'&&run)start()});play.onclick=start;retry.onclick=start;again.onclick=start;back.onclick=()=>{hide('dead');show('menu')};menu2.onclick=()=>{hide('win');show('menu')};draw();</script></body></html>
